name: Build and publish

# Builds the site on every push to main and force-pushes the built output to the
# `deploy` branch. Hostinger's Git integration is pointed at `deploy`, so that
# branch is literally the contents of public_html — nothing on it is source code.
#
# Why a separate branch: Hostinger clones a repo into the web root as-is and does
# not run a build. Publishing dist/ to its own branch keeps main clean while
# giving Hostinger something it can serve directly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      # Fails the build if any route is missing a canonical, has a duplicate or
      # over-length title, or if robots.txt/.htaccess did not make it into dist.
      - name: Build (includes SEO checks)
        run: pnpm run build

      - name: Publish dist to deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/sitemap.xml
          test -f dist/robots.txt

          cd dist
          git init --initial-branch=deploy --quiet
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Build ${GITHUB_SHA::7} — $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            deploy
          echo "Published $(find . -type f -not -path './.git/*' | wc -l) files to the deploy branch."
