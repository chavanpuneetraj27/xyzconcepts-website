name: CI

# Vercel builds and deploys the site itself, so this workflow does not publish
# anything. It exists to catch a broken build or a regressed SEO invariant on
# the repo side, independently of the deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      # Fails on a missing or wrong canonical, a duplicate or over-length title,
      # an out-of-band description, missing JSON-LD, or a file absent from dist.
      - name: Build (includes SEO checks)
        run: pnpm run build
